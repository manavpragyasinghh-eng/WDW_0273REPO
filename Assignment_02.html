<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 2 - Text Formatting</title>
</head>
<body>
    <!-- HTML provides six levels of headings -->
    <h1>Heading 1</h1>
    <h2>Heading 2</h2>
    <h3>Heading 3</h3>

    <!-- Demonstration of common text formatting tags -->
    <p>
        Text with <strong>bold</strong>, <em>italic</em>,
        <u>underline</u>, <mark>mark</mark>,
        H<sub>2</sub>O, x<sup>2</sup>
    </p>

    <!-- Character entities display reserved and special characters -->
    <p>&copy; &reg; &trade; &lt;tag&gt; &amp; &euro; &hearts; &heartsuit;</p>

    <hr>

    <!-- The br element moves the next text to a new line -->
    Line one<br>
    Line two
</body>
</html>
