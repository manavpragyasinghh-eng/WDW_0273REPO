<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 3 - Block and Inline Elements</title>
    <style>
        /* Block elements occupy the available width and start on new lines */
        .block {
            display: block;
            background-color: lightblue;
            margin: 4px 0;
            padding: 3px;
        }

        /* Inline elements occupy only the width required by their content */
        .inline {
            display: inline;
            background-color: lightgreen;
            margin-right: 3px;
            padding: 3px;
        }
    </style>
</head>
<body>
    <!-- These div elements are block-level elements -->
    <div class="block">Block 1</div>
    <div class="block">Block 2</div>

    <!-- These span elements are inline elements -->
    <span class="inline">Inline 1</span>
    <span class="inline">Inline 2</span>
    <span class="inline">Inline 3</span>
</body>
</html>
