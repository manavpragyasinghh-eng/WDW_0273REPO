<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 4 - Semantic Elements</title>
</head>
<body>
    <!-- Semantic tags describe the meaning of page sections -->
    <header>
        <h1>College Portal</h1>
    </header>

    <nav>
        <!-- Navigation links -->
        <a href="#home">Home</a> |
        <a href="#courses">Courses</a>
    </nav>

    <main id="home">
        <section id="courses">
            <h2>Admission Open</h2>
            <p>Apply before 30 June.</p>
        </section>

        <!-- Aside contains related or additional information -->
        <aside>
            <p>Notice: Library closed Sunday.</p>
        </aside>
    </main>

    <!-- Footer contains copyright information -->
    <footer>
        <p>&copy; 2026 College</p>
    </footer>
</body>
</html>
