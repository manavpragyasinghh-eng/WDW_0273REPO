<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 10 - Multimedia</title>
</head>
<body>
    <h3>Image</h3>
    <!-- Keep campus.jpg in the same folder as this HTML file -->
    <img src="campus.jpg" alt="College campus" width="180" height="150">

    <h3>Video</h3>
    <!-- Add your own video file named sample.mp4 in this folder -->
    <video width="320" controls>
        <source src="sample.mp4" type="video/mp4">
        Your browser does not support the video element.
    </video>

    <h3>Audio</h3>
    <!-- Add your own audio file named sample.mp3 in this folder -->
    <audio controls>
        <source src="sample.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>

    <h3>YouTube</h3>
    <!-- Replace VIDEO_ID with the ID of a YouTube video that allows embedding -->
    <iframe width="320" height="180"
        src="https://www.youtube.com/embed/VIDEO_ID"
        title="YouTube video player"
        allowfullscreen>
    </iframe>
</body>
</html>
