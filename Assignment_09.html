<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 9 - Quotation and Citation</title>
</head>
<body>
    <!-- blockquote is used for a longer quotation -->
    <blockquote>
        The best way to predict the future is to create it.
    </blockquote>

    <!-- q marks a short inline quotation -->
    <p>As he said, <q>Stay hungry, stay foolish.</q></p>

    <!-- cite identifies the title of a creative work -->
    <p>Book: <cite>The Pragmatic Programmer</cite></p>

    <!-- abbr displays its full form as a tooltip on hover -->
    <p><abbr title="World Wide Web Consortium">W3C</abbr> sets web standards.</p>

    <!-- address represents contact information -->
    <address>
        Contact: Admin Office<br>
        College Road, Delhi
    </address>

    <!-- del shows removed text and ins shows inserted text -->
    <p><del>Old price 500</del> <ins>New price 400</ins></p>
</body>
</html>
