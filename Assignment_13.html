<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 13 - Weekly Timetable</title>
    <style>
        table { border-collapse: collapse; }
        th, td { border: 1px solid black; padding: 8px; text-align: center; }
    </style>
</head>
<body>
    <table>
        <caption><strong>Weekly Timetable</strong></caption>
        <thead>
            <tr>
                <th>Day</th>
                <th>9-10</th>
                <th>10-11</th>
                <th>11-12</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <th>Mon</th>
                <td>Maths</td>
                <td>HTML</td>
                <!-- rowspan merges the Web Lab cell across Monday and Tuesday -->
                <td rowspan="2">Web Lab</td>
            </tr>
            <tr>
                <th>Tue</th>
                <td>DBMS</td>
                <td>OS</td>
            </tr>
            <tr>
                <th>Wed</th>
                <!-- colspan merges the Seminar cell across three time slots -->
                <td colspan="3">Seminar</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
